# Python 3.9 here is a guard, not a nicety: the runtime version check in the
# hook can only refuse AFTER the interpreter parsed the module, so syntax that
# 3.9 cannot parse would crash the guard open. This job is what prevents such
# a release. See docs/why-the-version-check-blocks.md.
name: tests
on: [push, pull_request]

# Least privilege: the job checks out the tree and runs stdlib tests. It needs
# no write token. Dependabot keeps the pinned action SHAs current.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      # Actions pinned to commit SHAs (not mutable tags) so a moved upstream tag
      # cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tests/test_rc_env_guard.py
      - run: python tests/test_compat.py
      - run: python tests/test_installer.py
